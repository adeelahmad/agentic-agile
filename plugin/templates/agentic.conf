# docs/agents/agentic.conf — per-project agentic-agile settings.
# KEY=VALUE lines, parsed (never executed). Delete a line to fall back to the default.
# The supervisor copies this template here on the first sprint if the file is missing.

# ── Per-task time box (every red-worker / scaffolder / green-worker attempt) ──
# SOFT: the worker is warned inside its tool results and told to wrap up.
# HARD: the worker is stopped and killed; the task is NOT retried, it goes back to the
#       planner to be split (mid-sprint re-plan). Defaults are deliberately tight:
#       a task that can't fit is a task that should be smaller.
AGENTIC_TOKENS_SOFT=40000
AGENTIC_TOKENS_HARD=60000
AGENTIC_TIME_SOFT_MIN=10
AGENTIC_TIME_HARD_MIN=15
# How many times one task lineage may be split before the sprint hard-stops (escalate).
AGENTIC_MAX_REPLANS=2
# A single task may loosen its own budget with one line under its `## Tn` heading in
# tasks.md, e.g.:   budget: tokens_hard=90000 time_hard=20
# (planner-authored, used sparingly, with a reason).

# ── Models (passed as the per-dispatch `model`; overrides the agent's frontmatter) ──
# Planning agents: intake, standards, planner, archivist (retrospective).
AGENTIC_MODEL_PLANNING=claude-opus-5-5
# Execution agents: red-worker, scaffolder, green-worker, structural-reviewer, final-gate.
AGENTIC_MODEL_WORKER=sonnet
